<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0008">
  <title>Para ti</title>
  <meta name="description" content="Un corazón hecho de luz, solo para ti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2026-11-10">
  <link rel="stylesheet" href="css/editor.css?v=2026-11-10">
</head>
<body class="is-gate">

  <div class="scene" id="scene">
    <!-- Estrellas, corazón de partículas y chispas (js/heart.js) -->
    <canvas id="space" aria-hidden="true"></canvas>

    <main class="ui">
      <!-- 1. Portada -->
      <section class="gate" id="gate">
        <h1 class="gate__title">
          <span class="gate__for" data-t="portada">Para</span>
          <span class="gate__name" data-t="para"></span>
        </h1>
        <button class="btn" id="startBtn" type="button"><span data-t="botonAbrir">Abrir</span></button>
      </section>

      <!-- 2. Corazón -->
      <section class="show" id="show">
        <nav class="bar" aria-label="Controles">
          <button class="chip" id="backBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            <span>Volver</span>
          </button>
          <span class="bar__gap"></span>
          <button class="chip" id="letterBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 7 8.5-7"/></svg>
            <span>Carta</span>
          </button>
        </nav>

        <!-- Zona tocable del corazón (también funciona con teclado) -->
        <button class="heart-hit" id="heartHit" type="button" aria-label="Tocar el corazón"></button>

        <div class="phrase" id="phrase">
          <p class="phrase__top" id="phraseTop" data-letters="frase"></p>
          <p class="phrase__name" data-t="para"></p>
        </div>
        <p class="hint" id="hint">Toca el corazón</p>
      </section>
    </main>
  </div>

  <!-- 3. Carta -->
  <div class="letter" id="letter" role="dialog" aria-modal="true" aria-labelledby="letterTitle" hidden>
    <div class="letter__backdrop" id="letterBackdrop"></div>
    <article class="note" id="note">
      <h2 class="note__title" id="letterTitle" data-t="cartaTitulo"></h2>
      <p class="note__text" id="noteText" aria-live="off"></p>
      <p class="note__sign" id="noteSign" data-t="firma"></p>
      <button class="btn btn--ghost" id="closeLetterBtn" type="button">Cerrar</button>
    </article>
  </div>

  <!-- ?v= obliga al celular a bajar los archivos nuevos: cámbialo al publicar cambios.
       Orden: contenido → lectura del enlace → partículas → escena → editor -->
  <script src="js/config.js?v=2026-11-10"></script>
  <script src="js/store.js?v=2026-11-10"></script>
  <script src="js/heart.js?v=2026-11-10"></script>
  <script src="js/main.js?v=2026-11-10"></script>
  <script src="js/editor.js?v=2026-11-10"></script>
</body>
</html>
